<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Fig Crimson Gradient -->
    <linearGradient id="figGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2185B"/>
      <stop offset="45%" stop-color="#880E4F"/>
      <stop offset="100%" stop-color="#4A0E17"/>
    </linearGradient>

    <!-- Warm Emirati Desert Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="40%" stop-color="#D6BE9F"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>

    <!-- Fresh Oasis Leaf Green -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1E150D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Outer Elegant Heritage Ring -->
  <circle cx="60" cy="60" r="56" fill="#FCFBF8" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#softShadow)"/>
  <circle cx="60" cy="60" r="51.5" fill="none" stroke="#D6BE9F" stroke-width="1" stroke-dasharray="2.5 2.5" opacity="0.8"/>

  <!-- Stylized Ripe Fig Body (Tear-drop organic form) -->
  <g transform="translate(0, 3)">
    <!-- Main Fig -->
    <path d="M 60 26 C 56 31 38 43 37 65 C 36 81 48 93 60 93 C 72 93 84 81 83 65 C 82 43 64 31 60 26 Z" 
          fill="url(#figGrad)" 
          filter="url(#softShadow)"/>

    <!-- Fig Volume & Shading Accent -->
    <path d="M 55 35 C 47 45 44 58 48 76 C 43 69 41 57 46 45 C 49 40 52 37 55 35 Z" 
          fill="#E91E63" 
          opacity="0.4"/>

    <!-- Golden Fig Flesh / Seed Glow Accent -->
    <path d="M 60 85 C 57 85 54 81 55 76 C 56 70 60 67 60 67 C 60 67 64 70 65 76 C 66 81 63 85 60 85 Z" 
          fill="#FFB300" 
          opacity="0.3"/>

    <!-- Fig Stem (Top) -->
    <path d="M 60 26 C 59.5 21 61.5 16 66 13 C 65 17 63.5 21 61 26 Z" 
          fill="#5D4037" 
          stroke="#3E2723" 
          stroke-width="0.5"/>

    <!-- Oasis Palm / Fig Leaf -->
    <path d="M 61 24 C 70 19 82 20 88 28 C 83 34 72 32 62 27 Z" 
          fill="url(#leafGrad)"/>
    <path d="M 61 24 Q 75 26 88 28" 
          stroke="#81C784" 
          stroke-width="0.9" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Second mini leaf sprout -->
    <path d="M 59 23 C 53 19 45 20 41 25 C 45 29 53 28 59 24 Z" 
          fill="#2E7D32" 
          opacity="0.85"/>
  </g>

  <!-- UAE National Pride Ribbon Bar at Base -->
  <g transform="translate(42, 88)">
    <clipPath id="uaeClip">
      <rect x="0" y="0" width="36" height="7" rx="3.5"/>
    </clipPath>
    <g clip-path="url(#uaeClip)">
      <rect x="0" y="0" width="9" height="7" fill="#DE2A2D"/>
      <rect x="9" y="0" width="27" height="2.33" fill="#007A3D"/>
      <rect x="9" y="2.33" width="27" height="2.34" fill="#FFFFFF"/>
      <rect x="9" y="4.67" width="27" height="2.33" fill="#141414"/>
    </g>
    <!-- Border around flag badge -->
    <rect x="0" y="0" width="36" height="7" rx="3.5" fill="none" stroke="#D6BE9F" stroke-width="0.75"/>
  </g>
</svg>
